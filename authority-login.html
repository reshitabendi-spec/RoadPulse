<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authority Login</title>

    <link rel="stylesheet" href="authority-login.css">

</head>

<body>

    <div class="login-container">

        <h1>🚦 RoadPulse</h1>

        <p>Authority Dashboard Access</p>

        <input
            type="password"
            id="otp"
            placeholder="Enter OTP received via SMS">

        <button id="verifyBtn">
            Verify OTP
        </button>

        <p id="message"></p>

    </div>

    <script type="module" src="authority-login.js"></script>

</body>

</html>
